{% extends "admin/change_list.html" %}

{% block content %}
<h2>Gráficos de Residuos</h2>

<!-- Formulario para el rango de fechas -->
<form id="dateRangeForm" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; background-color: #f9f9f9; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
    <div style="display: flex; align-items: center; gap: 10px;">
        <label for="start_date" style="font-weight: bold;">Fecha de inicio:</label>
        <input type="date" id="start_date" name="start_date" style="padding: 5px 10px; border: 1px solid #ccc; border-radius: 5px;">
        
        <label for="end_date" style="font-weight: bold;">Fecha de fin:</label>
        <input type="date" id="end_date" name="end_date" style="padding: 5px 10px; border: 1px solid #ccc; border-radius: 5px;">
        
        <button type="button" onclick="obtenerDatos()" style="padding: 5px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Filtrar</button>
    </div>
    
    <button type="button" onclick="generarReporte()" style="padding: 5px 15px; background-color: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Descargar Reporte en Excel</button>
</form>

<!-- Botón para descargar el reporte -->

<br>
<br>
<div style="display: flex; justify-content: space-between; margin-bottom: 40px;">
    <!-- Gráficos -->
    <div style="width: 48%;">
        <canvas id="myChart" width="400" height="200"></canvas>
    </div>
    <div style="width: 48%;">
        <canvas id="containerChart" width="400" height="200"></canvas>
    </div>
</div>

<!-- Importar Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Importar SheetJS para exportar a Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="text/javascript">
    async function obtenerDatos() {
        const startDate = document.getElementById('start_date').value;
        const endDate = document.getElementById('end_date').value;

        try {
            const response = await fetch(`{% url 'accounts.get_scan_data' %}?start_date=${startDate}&end_date=${endDate}`);
            if (response.ok) {
                const data = await response.json();

                console.log(data); // Verifica en consola los datos recibidos

                // Colores personalizados vivos
                const customColors = ['#FFB74D', '#4DB6AC', '#81C784', '#FFD54F', '#E0E0E0'];

                // Actualizar el primer gráfico (Escaneos por fecha)
                const dateLabels = data.date_labels;
                const dateValues = data.date_values;
                const ctx1 = document.getElementById('myChart').getContext('2d');

                if (window.myChartInstance) {
                    window.myChartInstance.destroy();
                }
                window.myChartInstance = new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: dateLabels,
                        datasets: [{
                            label: 'Escaneos por día',
                            data: dateValues,
                            backgroundColor: customColors[0],
                            borderColor: customColors[0],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Fecha'
                                }
                            },
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Cantidad de Escaneos'
                                }
                            }
                        }
                    }
                });

                // Actualizar el segundo gráfico (Escaneos por día y tipo de residuo)
                const wasteTypeLabels = data.waste_type_labels;
                const finalDates = data.final_dates;
                const finalData = data.final_data;
                const ctx2 = document.getElementById('containerChart').getContext('2d');

                const datasets = wasteTypeLabels.map((wasteType, index) => ({
                    label: wasteType,
                    data: finalData[wasteType],
                    backgroundColor: customColors[index % customColors.length],
                    borderColor: customColors[index % customColors.length],
                    borderWidth: 1
                }));

                if (window.containerChartInstance) {
                    window.containerChartInstance.destroy();
                }
                window.containerChartInstance = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: finalDates,
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Fecha'
                                }
                            },
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Cantidad por Tipo de Residuos'
                                }
                            }
                        }
                    }
                });
            } else {
                throw new Error('Error al obtener los datos');
            }
        } catch (error) {
            console.error('Hubo un problema con la solicitud:', error);
        }
    }

    // Función para generar y descargar el reporte en Excel
    function generarReporte() {
        const startDate = document.getElementById('start_date').value;
        const endDate = document.getElementById('end_date').value;

        // Datos de las gráficas
        const dateLabels = window.myChartInstance.data.labels;
        const dateValues = window.myChartInstance.data.datasets[0].data;

        const finalDates = window.containerChartInstance.data.labels;
        const datasets = window.containerChartInstance.data.datasets;

        // Crear hoja para los escaneos por día
        const sheet1Data = [["Fecha", "Escaneos por día"]];
        dateLabels.forEach((label, index) => {
            sheet1Data.push([label, dateValues[index]]);
        });

        // Crear hoja para los escaneos por tipo de residuo
        const sheet2Data = [["Fecha", ...datasets.map(dataset => dataset.label)]];
        finalDates.forEach((label, index) => {
            const row = [label];
            datasets.forEach(dataset => {
                row.push(dataset.data[index] || 0);
            });
            sheet2Data.push(row);
        });

        // Crear el libro y las hojas
        const workbook = XLSX.utils.book_new();
        const worksheet1 = XLSX.utils.aoa_to_sheet(sheet1Data);
        const worksheet2 = XLSX.utils.aoa_to_sheet(sheet2Data);

        XLSX.utils.book_append_sheet(workbook, worksheet1, "Escaneos por Día");
        XLSX.utils.book_append_sheet(workbook, worksheet2, "Escaneos por Tipo");

        // Descargar el archivo
        const filename = `Reporte_escaneos_${startDate}_a_${endDate}.xlsx`;
        XLSX.writeFile(workbook, filename);
    }

    document.addEventListener('DOMContentLoaded', obtenerDatos);
    
</script>


<div>
    <br>
    <br>
    <h2>Informacion de escaneo</h2>
    {{ block.super }}
</div>

{% endblock %}
